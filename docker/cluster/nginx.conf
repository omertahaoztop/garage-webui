# Local stand-in for a Cloudflare Load Balancer origin pool.
#
# In production each origin would be a geographically distinct Garage+webui
# node, and CF would health-check / fail over between them. Here we just
# round-robin across the three sidecars on the docker bridge network.
#
# Production tip: use `ip_hash` (or session-affinity at the CF level) once
# you enable AUTH_USER_PASS, so the scs cookie always lands on the same
# sidecar. With auth disabled (dev), round-robin is harmless.

worker_processes auto;
events {
  worker_connections 1024;
}

http {
  upstream garage_webui {
    # least_conn or ip_hash for session-affinity in production.
    server webui1:3909 max_fails=2 fail_timeout=10s;
    server webui2:3909 max_fails=2 fail_timeout=10s;
    server webui3:3909 max_fails=2 fail_timeout=10s;
    keepalive 16;
  }

  log_format upstream_combined '$remote_addr [$time_local] '
                               '"$request" $status $body_bytes_sent '
                               'upstream=$upstream_addr '
                               'rt=$request_time uct=$upstream_connect_time';
  access_log /dev/stdout upstream_combined;
  error_log  /dev/stderr warn;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 5G;   # match Garage S3 / object-browser uploads

  server {
    listen 80 default_server;
    server_name _;

    # Per-request load distribution; the upstream pool is stateless so any
    # node can answer. The `webui` is just a Go reverse proxy in front of
    # its local Garage admin endpoint -- all DCs see the same cluster state.
    location / {
      proxy_pass         http://garage_webui;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection        "";
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }
  }
}
